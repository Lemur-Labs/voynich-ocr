# Append-only. A later row supersedes an earlier one by saying so; rows are never edited or reordered.
- id: VO-001
  date: "2026-10-26"
  by: brian
  decision: Voynich OCR is a standalone research repository in Lemur-Labs. It is not a bridge tenant and not factory work, and its documents live in this repository.
  source: owner, planning session 2026-10-26
- id: VO-002
  date: "2026-10-26"
  by: brian
  decision: Not onboarded to the kit for now. The planning pattern (gated phases, trade studies, pre-registration) is meant for reuse on other projects, so the repository is built in the house's standard shape; the onboarding question stays open to the challenge in docs/plan.md section 7.
  source: owner, planning session 2026-10-26
- id: VO-003
  date: "2026-10-26"
  by: brian
  decision: Each phase is driven by a fresh Claude Code session launched by the owner with one line. The agent opens pull requests, CI and the red-team check gate them, and the agent merges on green. The owner reviews at gates only, and launch minutes count toward owner hours.
  source: owner accepted R1, docs/plan.md section 8, 2026-10-26
- id: VO-004
  date: "2026-10-26"
  by: brian
  decision: Formulation (F0) runs on weekday agent time; the four weekends bound compute and the owner's calendar, not agent work.
  source: owner accepted R2, docs/plan.md section 8, 2026-10-26
- id: VO-005
  date: "2026-10-26"
  by: brian
  decision: The recognizer's output alphabet is decided by a pre-registered rule, not by the owner - STA-AAA if spike S1 shows a deterministic mapping from all five sources, else basic Eva.
  source: owner accepted R3, docs/plan.md section 8, 2026-10-26
- id: VO-006
  date: "2026-10-26"
  by: brian
  decision: The owner sends all outreach (reviewer invitations, forum posts, buyer-test messages) from his own accounts, in one batch after G1, from agent drafts. AI assistance is disclosed in the post and the writeup. No agent posts or emails as the owner.
  source: owner accepted R4, docs/plan.md section 8, 2026-10-26
- id: VO-007
  date: "2026-10-26"
  by: brian
  decision: A reusable research-bet template is built after G4 from the lessons-learned, as a kit-compatible template; not before.
  source: owner accepted R5, docs/plan.md section 8, 2026-10-26
- id: VO-008
  date: "2026-10-26"
  by: brian
  decision: The pre-registration restates the calibration kill criterion (pass when the page-bootstrapped AUROC 95% interval lies above 0.5; kill when it includes 0.5), adds an ECE calibration measure, and requires the recognizer claim to hold on the leave-ZL-out disagreement map as well as the full one.
  source: owner accepted R6, docs/plan.md sections 1 (K-5, K-6), 3 and 8, 2026-10-26
- id: VO-009
  date: "2026-10-26"
  by: brian
  decision: The repository stays private until G1, then goes public with the map post. Code is MIT; the writeup, the map and other generated outputs are CC BY 4.0. Third-party transliterations and images are fetched by script and checked against a SHA-256 manifest, never committed.
  source: owner accepted R7, docs/plan.md section 8, 2026-10-26
- id: VO-010
  date: "2026-10-27"
  by: claude
  decision: Spike S1 found deterministic published mappings from all five sources into STA (bitrans rules files) and a deterministic forward function STA to STA-AAA (STA-aaa.bit, many-to-one). Under VO-005 the recognizer outputs STA-AAA. STA-aaa.bit is pinned by SHA-256 because its definition page is not yet final.
  source: docs/spikes/S1-sta-mapping.md; rule VO-005
- id: VO-011
  date: "2026-10-27"
  by: claude
  decision: The recognizer is Kraken 7.1.1 (CTC), run under Python 3.12. Glyph confidence comes from the full per-frame posteriors, never Kraken's built-in confidences.
  source: auto-decided under docs/plan.md section 5 (margin 17%); docs/spikes/S3-kraken.md
- id: VO-012
  date: "2026-10-27"
  by: claude
  decision: Clustering features come from frozen DINOv2 ViT-S/14 (Apache-2.0), with HOG as a reported control. DINOv3 is not used, because its download is gated and its license passes through to redistributors.
  source: auto-decided under docs/plan.md section 5; docs/spikes/S5-backbone-license.md
- id: VO-013
  date: "2026-10-27"
  by: claude
  decision: Line segmentation is Kraken's default blla model with a post-filter. A page whose filtered line count differs from its locus count is excluded, not corrected. Published word boxes (voynichese.com, arXiv 2608.17096) are not used.
  source: auto-decided under docs/plan.md section 5; docs/spikes/S4-segmentation.md
- id: VO-014
  date: "2026-10-27"
  by: claude
  decision: IVTFF is parsed by our own parser. Zandbergen's ivtt is fetched and compiled as a local differential oracle and never vendored, since it carries no license.
  source: auto-decided under docs/plan.md section 5 (margin 31%); docs/spikes/S2-ivtff-parser.md
- id: VO-015
  date: "2026-10-27"
  by: claude
  decision: Experiment tracking stays Make plus content-addressed artifacts and JSON metrics in git, with a Zenodo DOI at release. The synthetic hand is a glyph collage from cluster exemplars.
  source: auto-decided under docs/plan.md section 5 (D6, D7)
- id: VO-016
  date: "2026-10-27"
  by: claude
  decision: The Naibbe arm vendors Greshko's naibbe-cipher Python at a pinned commit, with attribution and a citation, under a seeded RNG wrapper. Its known-answer test is the shipped ciphertext/plaintext pairs plus round-trips.
  source: docs/spikes/S6-naibbe.md
- id: VO-017
  date: "2026-10-27"
  by: brian
  decision: Supersedes VO-008's gated statistic. H3 gates on within-type AUROC (full and leave-ZL-out maps) and within-page AUROC (full map). The full-map within-type lower bound must also exceed the within-type AUROC of the span-width and page-mean-confidence baselines. Pooled AUROC and the token-level baselines are reported, not gated.
  source: owner approved KDP-F E1 with the baseline fix, 2026-10-27
- id: VO-018
  date: "2026-10-27"
  by: brian
  decision: No fixed 0.60 bar. The H3 gate voids, rather than kills, when too few gated glyphs fall in groups large enough to score; the coverage minimum is fixed at G1 from non-test pages by amendment, before any test inference.
  source: owner approved KDP-F E2 with the underpower fix, 2026-10-27
- id: VO-019
  date: "2026-10-27"
  by: brian
  decision: Map v0 is published with the 40 test pages' rows withheld until G3.
  source: owner approved KDP-F E3, 2026-10-27
- id: VO-020
  date: "2026-10-27"
  by: brian
  decision: The leave-{ZL, IT}-out arm is reported, not gated. The writeup may say "independent of ZL" only if its within-type lower bound exceeds 0.5.
  source: owner approved KDP-F E4, 2026-10-27
- id: VO-021
  date: "2026-10-27"
  by: brian
  decision: docs/prereg.md is frozen with sha256 9d33cd8e1bb90ca3fb1eeabc6ea4cc003a18da4889744f81b39ba9b6456bc06d. Later changes are appended amendments only.
  source: owner approved KDP-F E5, 2026-10-27
