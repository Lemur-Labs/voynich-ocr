- id: VO-034
  date: "2026-10-29"
  by: claude
  decision: Supersedes VO-013's exclusion rule for G2 inference. A page's rows pair with its paragraph loci by count when the counts match and the labelled lines pass training's lines.screen (single-row heights, then VO-031's width-to-label-length correlation, which passes pages with fewer than 6 kept lines unchecked); unlabelled lines stay unless taller than 1.5 times the labelled median. Otherwise rows pair by text, an order-preserving alignment of decoded rows to ZL locus tokens over the single-height rows.
  source: PR 15; src/voynich_ocr/instances.py pair_rows
- id: VO-035
  date: "2026-10-29"
  by: claude
  decision: A glyph instance's crop is the line polygon between the midpoints of the CTC frame gaps to its neighbours, mapped to the baseline by an affine fit to kraken's span positions. Rows with fewer than two distinct interior span frames keep kraken's own cut. Spaces are not instances. This replaced kraken's cuts after a validation dry run whose outcome was kill; the trigger was the share of crops narrower than a glyph on non-test pages, 14.6% before and 1.1% after.
  source: PR 15; src/voynich_ocr/recognize.py
- id: VO-036
  date: "2026-10-29"
  by: claude
  decision: H2 clustering uses k = 2 times the distinct non-space tokens in the recognizer's training and early-stopping labels, 220, fitted by k-means in float64 with seed 20261027 and 10 restarts. The float64 fit keeps BLAS rounding from changing which restart wins; two fits on this machine are identical.
  source: PR 15; src/voynich_ocr/clusters.py
