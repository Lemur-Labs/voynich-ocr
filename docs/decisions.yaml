- id: VO-053
  date: "2026-10-29"
  by: claude
  decision: "Readings of H3 made in code, recorded before the G3 gate. Each map (full, leave-ZL-out, leave-ZL-IT-out) aligns the recognized line to its own column consensus and gates by its own columns' tier and flags, so the three maps score different glyph populations. In leave-ZL-out the zl_uncertain filter has no effect, and in leave-ZL-IT-out a column is tier 3 only when GC, FG and CD all contribute. The leave-ZL-out lower bound decides pass versus narrow. A glyph's type is its recognized token. B1 is a recognized token's share of G2's gated instances in disagreeing columns, on non-test pages that are not being scored; a token unseen there gets the pooled share. B2 is −log of a token's frequency among the training labels' tokens; a token absent from them scores +∞. B3 counts the token's letter-digit stroke codes. B5 is the mean confidence at T of all non-space glyphs on the page's paired rows, gated or not, inserted ones included. ECE is computed on the leave-{ZL, IT}-out map's gated glyphs. A glyph agrees when that column's majority, taken over all covering sources' readings with a gap counted as a reading and ties going to the earliest source, is non-empty and every token in it equals the glyph's token, since a merged column holds a run of one token. CER is the summed token edit distance over the summed reference length, spaces excluded. The references are the line's ZL tokens, which keep `?`, a token the recognizer cannot emit, and are empty where ZL does not cover the locus, and the full-map column consensus. The temperature fit uses the validation pages' G2-paired rows; lines with a `?` or a token outside the codec carry no label, and lines no CTC path can emit are dropped. Glyph spans and confidences are taken from kraken 7.1.1's `logits`, which are softmax outputs, so T divides their logarithms and the result is renormalized."
  source: src/voynich_ocr/{g3,recognize,instances,align,disagreement}.py on main 670a54c
